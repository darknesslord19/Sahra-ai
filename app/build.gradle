plugins { id 'com.android.application' }

android {
    namespace 'com.guven.sahra'
    compileSdk 34

    defaultConfig {
        applicationId 'com.guven.sahra'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "0.2.${System.getenv('GITHUB_RUN_NUMBER') ?: '1'}"
        // Ses tanıma kitaplığı yalnızca telefon işlemcileri için paketlenir
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    compileOptions {
        encoding 'UTF-8'
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // "Sahra" adını telefonda tanımak için (Apache 2.0)
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation('com.alphacephei:vosk-android:0.3.47') { transitive = false }
}
