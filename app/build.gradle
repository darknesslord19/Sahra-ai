plugins { id 'com.android.application' }

android {
    namespace 'com.guven.sahra'
    compileSdk 34

    defaultConfig {
        applicationId 'com.guven.sahra'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "0.1.${System.getenv('GITHUB_RUN_NUMBER') ?: '1'}"
    }
    compileOptions {
        encoding 'UTF-8'
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
