<script>
/* Sahra 3B motoru: dış kütüphane yok */
const V={ek:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],cik:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],carp:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
 nokta:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],vek:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
 boy:a=>Math.hypot(a[0],a[1],a[2]),bir:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]},kar:(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t)};
function mc(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o}
function trs(t,r,s){const[cx,cy,cz]=r.map(Math.cos),[sx,sy,sz]=r.map(Math.sin);
 /* T * Ry * Rx * Rz * S */
 const m00=cy*cz+sy*sx*sz,m01=-cy*sz+sy*sx*cz,m02=sy*cx,m10=cx*sz,m11=cx*cz,m12=-sx,m20=-sy*cz+cy*sx*sz,m21=sy*sz+cy*sx*cz,m22=cy*cx;
 return new Float32Array([m00*s[0],m10*s[0],m20*s[0],0,m01*s[1],m11*s[1],m21*s[1],0,m02*s[2],m12*s[2],m22*s[2],0,t[0],t[1],t[2],1])}
/* +y eksenini verilen yöne çeviren matris */
function yonel(p,yon,s,ipucu){const y=V.bir(yon);let h=ipucu||[0,0,1];if(Math.abs(V.nokta(y,h))>.96)h=[1,0,0];const x=V.bir(V.vek(y,h)),z=V.vek(x,y);
 return new Float32Array([x[0]*s[0],x[1]*s[0],x[2]*s[0],0,y[0]*s[1],y[1]*s[1],y[2]*s[1],0,z[0]*s[2],z[1]*s[2],z[2]*s[2],0,p[0],p[1],p[2],1])}
function izgara(nu,nv,f){const P=[],N=[],T=[],I=[];for(let j=0;j<=nv;j++)for(let i=0;i<=nu;i++){const o=f(i/nu,j/nv);P.push(...o.p);N.push(...V.bir(o.n));T.push(i/nu,j/nv)}
 for(let j=0;j<nv;j++)for(let i=0;i<nu;i++){const a=j*(nu+1)+i,b=a+nu+1;I.push(a,a+1,b,a+1,b+1,b)}return{P,N,T,I}}
const us=(v,e)=>Math.sign(v)*Math.pow(Math.abs(v),e);
/* süper elipsoit: e=1 küre, küçüldükçe kutulaşır */
function sekil(a,b,c,e1=1,e2=1,nu=56,nv=36){return izgara(nu,nv,(u,v)=>{const t=(u-.5)*2*Math.PI,f=(v-.5)*Math.PI,cf=Math.cos(f),sf=Math.sin(f),ct=Math.cos(t),st=Math.sin(t);
 return{p:[a*us(cf,e1)*us(st,e2),b*us(sf,e1),c*us(cf,e1)*us(ct,e2)],n:Math.abs(cf)<1e-6?[0,sf,0]:[us(cf,2-e1)*us(st,2-e2)/a,us(sf,2-e1)/b,us(cf,2-e1)*us(ct,2-e2)/c]}})}
/* dönel yüzey: profil [yarıçap,y] listesi (alttan üste) */
function donel(pr,nu=48){const n=pr.length-1;return izgara(nu,n,(u,v)=>{const j=Math.round(v*n),t=u*2*Math.PI,[r,y]=pr[j],a=pr[Math.max(0,j-1)],b=pr[Math.min(n,j+1)],dr=b[0]-a[0],dy=b[1]-a[1];
 return{p:[r*Math.sin(t),y,r*Math.cos(t)],n:[dy*Math.sin(t),-dr,dy*Math.cos(t)]}})}
function halka(R,r,nu=64,nv=16,yay=2*Math.PI){return izgara(nu,nv,(u,v)=>{const t=u*yay,f=v*2*Math.PI,k=R+r*Math.cos(f);return{p:[k*Math.cos(t),k*Math.sin(t),r*Math.sin(f)],n:[Math.cos(f)*Math.cos(t),Math.cos(f)*Math.sin(t),Math.sin(f)]}})}
/* y boyunca 0..1 uzanan çubuk */
const cubukGeo=()=>donel([[0,0],[1,0],[1,1],[0,1]],20);
/* düz yüzlü kristal */
function kristal(m){const P=[],N=[],T=[],I=[];const g=m;for(let i=0;i<g.I.length;i+=3){const k=[0,1,2].map(j=>g.P.slice(g.I[i+j]*3,g.I[i+j]*3+3));
 let n=V.vek(V.cik(k[1],k[0]),V.cik(k[2],k[0]));if(V.boy(n)<1e-6)continue;if(V.nokta(n,k[0])<0)n=V.carp(n,-1);n=V.bir(n);
 for(const p of k){P.push(...p);N.push(...n);T.push(0,0);I.push(I.length)}}return{P,N,T,I}}
/* ekran yaması: ön yüzeye oturan dokulu parça */
function yama(w,h,y0,z,pay=.012){return izgara(40,28,(u,v)=>{const x=(u-.5)*w,y=(v-.5)*h+y0,e=.004,zz=z(x,y),dx=(z(x+e,y)-z(x-e,y))/(2*e),dy=(z(x,y+e)-z(x,y-e))/(2*e);
 const n=V.bir([-dx,-dy,1]);return{p:[x+n[0]*pay,y+n[1]*pay,zz+n[2]*pay],n}})}
const elipsZ=(a,b,c,e=2,taban=.12)=>(x,y)=>c*Math.pow(Math.max(taban,1-Math.pow(Math.abs(x/a),e)-Math.pow(Math.abs(y/b),e)),1/e);

class Motor{
 constructor(cv){const gl=this.gl=cv.getContext('webgl',{alpha:true,antialias:true,premultipliedAlpha:true,preserveDrawingBuffer:true});if(!gl)throw Error('WebGL yok');this.cv=cv;this.ag=new WeakMap();
  const vs='attribute vec3 p,n;attribute vec2 t;uniform mat4 uM,uP;uniform mat3 uN;varying vec3 vn,vp;varying vec2 vt;void main(){vec4 w=uM*vec4(p,1.);vp=w.xyz;vn=uN*n;vt=t;gl_Position=uP*w;}';
  const fs=`precision mediump float;varying vec3 vn,vp;varying vec2 vt;uniform vec3 uC,uKam,uIsik;uniform float uSpec,uShine,uEmis,uTex,uGlow,uA;uniform sampler2D uS;
  void main(){vec3 n=normalize(vn);vec3 v=normalize(uKam-vp);if(dot(n,v)<0.&&uTex<.5)n=-n;
  vec3 l1=normalize(vec3(-.5,.72,.62)),l2=normalize(vec3(.8,.1,.35));
  float s1=pow(max(dot(n,normalize(l1+v)),0.),uShine),s2=pow(max(dot(n,normalize(l2+v)),0.),uShine*1.6);
  float fr=pow(1.-max(dot(n,v),0.),2.4);
  if(uTex>.5){vec4 k=texture2D(uS,vt);if(k.a<.02)discard;float g=(s1*.22+s2*.1)*k.a;gl_FragColor=vec4(k.rgb*k.a+g,k.a);return;}
  float d=clamp((dot(n,l1)+.45)/1.45,0.,1.);float d2=max(dot(n,l2),0.);
  vec3 ortam=mix(vec3(.42,.40,.46),vec3(.66,.69,.76),n.y*.5+.5);
  vec3 c=uC*(ortam*.78+d*.52+d2*.12);c+=vec3(s1+s2*.5)*uSpec;c+=fr*vec3(.20,.24,.32)*uSpec;c+=uIsik*fr*uGlow;
  c=mix(c,uC*1.15,uEmis);gl_FragColor=vec4(min(c,1.)*uA,uA);}`;
  const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(o));return o};
  const pr=this.pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
  this.a={};['p','n','t'].forEach(k=>this.a[k]=gl.getAttribLocation(pr,k));this.u={};['uM','uP','uN','uC','uKam','uIsik','uSpec','uShine','uEmis','uTex','uGlow','uA','uS'].forEach(k=>this.u[k]=gl.getUniformLocation(pr,k));
  gl.enable(gl.DEPTH_TEST);gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA)}
 tampon(g){let o=this.ag.get(g);if(o)return o;const gl=this.gl,b=(d,h=gl.ARRAY_BUFFER,T=Float32Array)=>{const x=gl.createBuffer();gl.bindBuffer(h,x);gl.bufferData(h,new T(d),gl.STATIC_DRAW);return x};
  o={p:b(g.P),n:b(g.N),t:b(g.T),i:b(g.I,gl.ELEMENT_ARRAY_BUFFER,Uint16Array),s:g.I.length};this.ag.set(g,o);return o}
 doku(){const gl=this.gl,t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);for(const[k,v]of[[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR]])gl.texParameteri(gl.TEXTURE_2D,k,v);return t}
 yukle(t,cv){const gl=this.gl;gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cv)}
 ciz(kok,isik,uzak){const gl=this.gl,w=this.cv.width,h=this.cv.height;gl.viewport(0,0,w,h);gl.clearColor(0,0,0,0);gl.depthMask(true);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  const f=1/Math.tan(13*Math.PI/180),yakin=.5,en=60,oran=w/h,fx=oran>=1?f/oran:f,fy=oran>=1?f:f*oran;
  const P=new Float32Array([fx,0,0,0,0,fy,0,0,0,0,(en+yakin)/(yakin-en),-1,0,0,2*en*yakin/(yakin-en),0]);
  const kam=[0,.35,uzak],e=Math.atan2(.35,uzak),Vm=mc(trs([0,0,-Math.hypot(.35,uzak)],[0,0,0],[1,1,1]),trs([0,0,0],[e,0,0],[1,1,1]));
  gl.uniformMatrix4fv(this.u.uP,false,mc(P,Vm));gl.uniform3fv(this.u.uKam,kam);gl.uniform3fv(this.u.uIsik,isik);
  const saydam=[];const gez=(d,M)=>{if(d.gizli)return;const m=mc(M,d.m||trs(d.t,d.r,d.s));if(d.geo){const x=[d,m];(d.mat.tex||d.mat.a<1)?saydam.push(x):this.parca(...x)}for(const k of d.alt)gez(k,m)};
  gez(kok,trs([0,0,0],[0,0,0],[1,1,1]));gl.depthMask(false);for(const x of saydam)this.parca(...x);gl.depthMask(true)}
 parca(d,m){const gl=this.gl,o=this.tampon(d.geo),u=this.u,k=d.mat;for(const[ad,n]of[['p',3],['n',3],['t',2]]){gl.bindBuffer(gl.ARRAY_BUFFER,o[ad]);gl.enableVertexAttribArray(this.a[ad]);gl.vertexAttribPointer(this.a[ad],n,gl.FLOAT,false,0,0)}
  const a=m[0],b=m[1],c=m[2],e=m[4],f=m[5],g=m[6],h=m[8],i=m[9],j=m[10];/* ters devrik */
  gl.uniformMatrix3fv(u.uN,false,[f*j-g*i,g*h-e*j,e*i-f*h,c*i-b*j,a*j-c*h,b*h-a*i,b*g-c*f,c*e-a*g,a*f-b*e]);
  gl.uniformMatrix4fv(u.uM,false,m);gl.uniform3fv(u.uC,k.c);gl.uniform1f(u.uSpec,k.spec);gl.uniform1f(u.uShine,k.shine);gl.uniform1f(u.uEmis,k.emis);gl.uniform1f(u.uGlow,k.glow);gl.uniform1f(u.uA,k.a);
  gl.uniform1f(u.uTex,k.tex?1:0);if(k.tex){gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,k.tex);gl.uniform1i(u.uS,0)}
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,o.i);gl.drawElements(gl.TRIANGLES,o.s,gl.UNSIGNED_SHORT,0)}
}
const renk=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);
const mal=(h,o={})=>Object.assign({c:renk(h),spec:.42,shine:48,emis:0,glow:0,a:1},o);
function dugum(geo,mat,t=[0,0,0],r=[0,0,0],s=[1,1,1]){return{geo,mat,t:t.slice(),r:r.slice(),s:s.slice(),alt:[],m:null,gizli:false,ekle(...k){this.alt.push(...k);return k[0]}}}
const grup=(t,r,s)=>dugum(null,null,t,r,s);

/* Ekran yüz: bütün modeller aynı gözleri kullanır */
const GOZLER=[['normal','Normal'],['happy','Mutlu'],['laugh','Gülme'],['heart','Kalp'],['star','Yıldız'],['wink','Göz kırpma'],['wow','Şaşkın'],['excited','Heyecanlı'],['sad','Üzgün'],['angry','Kızgın'],['sleepy','Uykulu'],['dizzy','Başı döndü'],['xeyes','Bayıldı'],['cool','Havalı'],['music','Müzik'],['think','Düşünme'],['suspect','Şüpheli'],['pixel','Piksel'],['scan','Tarama'],['side','Yan bakış'],['roll','Göz devirme']];
const AGIZLAR=[['oto','İfadeye göre'],['yok','Ağız yok'],['gulus','Gülümseme'],['konus','Konuşma']];
function yuvarla(c,x,y,w,h,rx,ry){c.beginPath();c.moveTo(x+rx,y);c.lineTo(x+w-rx,y);c.ellipse(x+w-rx,y+ry,rx,ry,0,-Math.PI/2,0);c.lineTo(x+w,y+h-ry);c.ellipse(x+w-rx,y+h-ry,rx,ry,0,0,Math.PI/2);c.lineTo(x+rx,y+h);c.ellipse(x+rx,y+h-ry,rx,ry,0,Math.PI/2,Math.PI);c.lineTo(x,y+ry);c.ellipse(x+rx,y+ry,rx,ry,0,Math.PI,Math.PI*1.5);c.closePath()}
function kalpYol(c,r){c.beginPath();c.moveTo(0,r);c.bezierCurveTo(-r*1.5,0,-r*.9,-r*1.25,0,-r*.45);c.bezierCurveTo(r*.9,-r*1.25,r*1.5,0,0,r);c.closePath()}
function yildizYol(c,r){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,k=i%2?r*.45:r;c.lineTo(k*Math.cos(a),k*Math.sin(a))}c.closePath()}
function yuzCiz(c,o){const W=c.canvas.width,H=c.canvas.height,t=o.t,ifade=o.goz;c.clearRect(0,0,W,H);
 const p=o.pay,w=W*(1-2*p),h=H*(1-2*p),x0=W*p,y0=H*p;
 const yol=(q=0)=>yuvarla(c,x0-q,y0-q,w+2*q,h+2*q,Math.min((w+2*q)/2,(w+2*q)*o.kose[0]),Math.min((h+2*q)/2,(h+2*q)*o.kose[1]));
 /* kenar halkası */
 if(o.halka){c.save();const g=c.createConicGradient(t*o.halka.hiz,W/2,H/2),l=o.halka.renkler;l.concat(l[0]).forEach((r,i)=>g.addColorStop(i/l.length,r));c.globalAlpha=o.halka.guc;c.shadowColor=l[0];c.shadowBlur=W*.04;c.fillStyle=g;yol(W*.026);c.fill();c.restore()}
 const z=c.createRadialGradient(W/2,H*.38,0,W/2,H/2,W*.62);z.addColorStop(0,o.zemin[0]);z.addColorStop(1,o.zemin[1]);c.fillStyle=z;yol();c.fill();
 c.save();yol();c.clip();
 const ana=ifade==='heart'?'#ff5a9c':ifade==='star'?'#ffcc3d':ifade==='angry'?'#ff5a5a':ifade==='pixel'?'#4ade80':ifade==='xeyes'?'#fda4af':o.renk;
 c.fillStyle=ana;c.strokeStyle=ana;c.shadowColor=ana;c.shadowBlur=W*.05;c.lineCap='round';c.lineJoin='round';
 let bx=o.bakX*w*.09,by=o.bakY*h*.07,ara=w*.205,ew=h*.165,eh=h*.34;
 const dal=s=>Math.sin(t*s);
 if(ifade==='side')bx+=dal(2.4)*w*.12;if(ifade==='scan')bx+=Math.asin(dal(3.2))*w*.085;if(ifade==='suspect')bx+=dal(1.5)*w*.07;
 if(ifade==='roll'){bx+=Math.cos(t*3.4)*w*.07;by+=Math.sin(t*3.4)*h*.1}if(ifade==='think'){bx+=w*.05;by-=h*.08}
 const cy=H*.47;
 if(o.yazi){c.font=`800 ${h*.34}px ui-monospace,Menlo,monospace`;c.textBaseline='middle';const tw=c.measureText(o.yazi).width;c.fillText(o.yazi,x0+w-o.yaziSure*h*.75,cy);if(o.yaziSure*h*.75>tw+w&&o.yaziBitti)o.yaziBitti();c.restore();return}
 for(const s of[-1,1]){const i=s<0?0:1;c.save();c.translate(W/2+s*ara+bx,cy+by);
  let gw=ew,gh=eh;const kirp=o.kirp;
  const oval=(a,b)=>{yuvarla(c,-a/2,-b/2,a,b,a/2,Math.min(b/2,a*.62));c.fill()};
  const yay=(a,ters)=>{c.lineWidth=h*.085;c.beginPath();c.arc(0,ters?-a*.5:a*.5,a,ters?Math.PI*.18:Math.PI*1.18,ters?Math.PI*.82:Math.PI*1.82);c.stroke()};
  switch(ifade){

   case'heart':{const k=1+.12*dal(11);c.scale(k,k);kalpYol(c,h*.17);c.fill();break}

   case'wink':if(s<0)yay(ew*.85);else oval(gw,gh*Math.max(.08,1-kirp));break;
   case'wow':oval(h*.27,h*.4);c.fillStyle=o.zemin[1];c.shadowBlur=0;c.beginPath();c.arc(0,0,h*.055,0,7);c.fill();break;
   case'excited':oval(gw*1.35,gh*(1.2+.08*dal(15)));c.fillStyle='#fff';c.beginPath();c.arc(s*-gw*.2,-gh*.28,gw*.2,0,7);c.fill();break;
   case'sad':c.rotate(s*.36);oval(gw,gh*.72);if(s>0){c.rotate(-s*.36);const q=(t*.9)%1;c.globalAlpha=1-q;c.fillStyle='#9fdcff';c.beginPath();c.ellipse(0,eh*(.42+q*.8),ew*.24,ew*.36,0,0,7);c.fill()}break;
   case'angry':c.rotate(-s*.42);yuvarla(c,-ew*.72,-eh*.24,ew*1.44,eh*.52,ew*.35,eh*.2);c.fill();break;
   case'sleepy':oval(gw*1.25,eh*(.13+.05*dal(2)));if(s>0){const q=(t*.5)%1;c.globalAlpha=1-q;c.font=`800 ${h*(.1+q*.08)}px sans-serif`;c.fillText('z',ew*(.8+q),-eh*(.4+q*.7))}break;
   case'dizzy':c.rotate(s*t*7);c.lineWidth=h*.032;c.beginPath();for(let a=0;a<17;a+=.3){const r=a*h*.0108;c.lineTo(r*Math.cos(a),r*Math.sin(a))}c.stroke();break;
   case'xeyes':c.lineWidth=h*.075;c.beginPath();c.moveTo(-ew*.6,-ew*.6);c.lineTo(ew*.6,ew*.6);c.moveTo(ew*.6,-ew*.6);c.lineTo(-ew*.6,ew*.6);c.stroke();break;
   case'cool':{const g=c.createLinearGradient(0,-h*.14,0,h*.14);g.addColorStop(0,'#e0fbff');g.addColorStop(.45,'#22d3ee');g.addColorStop(1,'#1d4ed8');c.fillStyle=g;yuvarla(c,-w*.17,-h*.13,w*.34,h*.27,w*.04,h*.1);c.fill();if(s<0){c.fillRect(w*.16,-h*.1,w*.1,h*.045)}break}
   case'music':{for(let k=-1;k<=1;k++){const b=eh*(.25+.75*Math.abs(Math.sin(t*7+k*1.7+i*2.3)));yuvarla(c,k*ew*.62-ew*.2,-b/2,ew*.4,b,ew*.18,ew*.18);c.fill()}break}
   case'think':oval(gw,s<0?gh:gh*.5);if(s>0){c.fillStyle='#fde68a';c.font=`800 ${h*.2}px sans-serif`;c.globalAlpha=.6+.4*dal(5);c.fillText('?',ew*.85,-eh*.35)}break;
   case'suspect':yuvarla(c,-ew*.85,-eh*.13,ew*1.7,eh*.27,ew*.25,eh*.1);c.fill();break;
   case'pixel':{const b=(Math.floor(t*2)%2)?gh*.45:gh;c.shadowBlur=W*.02;const q=h*.052;for(let yy=-b/2;yy<b/2;yy+=q)for(let xx=-gw*.6;xx<gw*.5;xx+=q)c.fillRect(xx,yy,q*.82,q*.82);break}
   case'scan':oval(gw,gh*.55);break;
   default:{const g=c.createRadialGradient(0,-gh*.05,0,0,0,gh*.62);g.addColorStop(0,'#fff');g.addColorStop(.35,'#f4fffb');g.addColorStop(1,ana);c.fillStyle=g;oval(gw,gh*Math.max(.08,1-kirp))}
  }c.restore()}

function halkaBul(t,dinle){
 if(!isik||isik.sekil==='orijinal'||(dinle&&!isik.dinle))return{halka:{renkler:dinle?RAIN:YESIL,hiz:dinle?3.3:.35,guc:dinle?1:.62+.38*(.5+.5*Math.sin(t*1.96))},goz:null,guc:dinle?1:.45};
 const l=isik.renkler.map(hex),n=l.length,f=t/isik.sure,i=Math.floor(f)%n,p=f%1,s=isik.sekil;let c=l[i];
 if(s==='sabit'||s==='donen')c=kar(c,l[(i+1)%n],yumusak(p));else if(p>.85)c=kar(c,l[(i+1)%n],yumusak((p-.85)/.15));
 const k=isik.alt+(isik.ust-isik.alt)*dalga(s,p),d=s==='donen'&&n>1,ac=kar(c,[255,255,255],.45);
 return{halka:{renkler:d?isik.renkler:[yazHex(c),yazHex(ac),yazHex(c)],hiz:2*Math.PI/(isik.sure*1.4),guc:k},goz:isik.goz?yazHex(ac):null,guc:k}}

function neOynasin(){
 const dinle=S.durum==='active';
 /* öncelik: dokunma tepkisi, dinleme/konuşma, seçili ayarlar */
 if(tepki&&T<tepki.bit){const x=TEPKILER[tepki.ad];return{goz:x[1],poz:x[2],hareket:x[3]}}
 tepki=null;
 let goz=S.kip,poz=S.poz,hareket=S.hareket;
 if(S.kip==='rastgele'){
  if(ifade&&T>ifadeBit)ifade=null;
  if(!ifade&&T>sonrakiIfade&&!dinle){const a=Object.keys(SURE);ifade=a[Math.random()*a.length|0];ifadeBit=T+SURE[ifade];sonrakiIfade=ifadeBit+2.4+Math.random()*2.6}
  goz=ifade||'normal'}
 if(S.poz==='oto'){
  if(jest&&T>jestBit)jest=null;
  if(!jest&&T>sonrakiJest&&!dinle){jest=JESTLER[Math.random()*JESTLER.length|0];jestBit=T+2.8;sonrakiJest=jestBit+6+Math.random()*8}
  poz='dinlen';if(jest&&!dinle){if(bul(POZLAR,jest[0]))poz=jest[0];if(S.kip==='rastgele')goz=jest[1]}}
 if(dinle){if(S.kip==='rastgele')goz='normal';if(S.poz==='oto')poz=S.konusuyor?'dinlen':'kulak'}
 return{goz,poz,hareket}}

/* ---------- eller pencereden taşmasın ---------- */
const BIRIM=()=>trs([0,0,0],[0,0,0],[1,1,1]);
function ustMatris(d,aranan,M){if(d===aranan)return M;const m=mc(M,d.m||trs(d.t,d.r,d.s));
 for(const k of d.alt){const x=ustMatris(k,aranan,m);if(x)return x}return null}
/* Elin her noktası motorun kamerasıyla ekrana izdüşürülür; kenarı aşan kadar el içeri çekilir */
function sigdir(el,ust,uzak){
 const f=1/Math.tan(13*Math.PI/180),oran=tuval.width/tuval.height,fx=oran>=1?f/oran:f,fy=oran>=1?f:f*oran;
 const e=Math.atan2(.35,uzak),D=Math.hypot(.35,uzak),ce=Math.cos(e),se=Math.sin(e),SINIR=.95;
 let sol=0,sag=0,alt=0,usttasan=0;
 const gez=(d,M)=>{if(d.gizli)return;const m=mc(M,d.m||trs(d.t,d.r,d.s));
  if(d.geo){const P=d.geo.P;for(let i=0;i<P.length;i+=3){const x=P[i],y=P[i+1],z=P[i+2],
    wx=m[0]*x+m[4]*y+m[8]*z+m[12],wy=m[1]*x+m[5]*y+m[9]*z+m[13],wz=m[2]*x+m[6]*y+m[10]*z+m[14],
    vy=ce*wy-se*wz,uzaklik=D-(se*wy+ce*wz),yx=SINIR*uzaklik/fx,yy=SINIR*uzaklik/fy;
    sag=Math.max(sag,wx-yx);sol=Math.max(sol,-yx-wx);usttasan=Math.max(usttasan,vy-yy);alt=Math.max(alt,-yy-vy)}}
  for(const k of d.alt)gez(k,m)};
 gez(el,ust);
 const kx=sol-sag,ky=alt-usttasan;if(!kx&&!ky)return;
 /* ekrandaki kaydırmayı elin bağlı olduğu düğümün eksenlerine çevir */
 const w=[kx,ky*ce,-ky*se],a=ust[0],b=ust[4],c=ust[8],g=ust[1],h=ust[5],i=ust[9],j=ust[2],k=ust[6],l=ust[10];
 const A=h*l-i*k,B=i*j-g*l,C=g*k-h*j,det=a*A+b*B+c*C;if(Math.abs(det)<1e-6)return;
 const m=new Float32Array(el.m);
 m[12]+=(A*w[0]+(c*k-b*l)*w[1]+(b*i-c*h)*w[2])/det;
 m[13]+=(B*w[0]+(a*l-c*j)*w[1]+(c*g-a*i)*w[2])/det;
 m[14]+=(C*w[0]+(b*j-a*k)*w[1]+(a*h-b*g)*w[2])/det;
 el.m=m}

const UZAKLIK=8.8;
function ciz(dt){
 const w=Math.max(1,Math.round(innerWidth*Math.min(2,devicePixelRatio||1))),h=Math.max(1,Math.round(innerHeight*Math.min(2,devicePixelRatio||1)));
 if(tuval.width!==w||tuval.height!==h){tuval.width=w;tuval.height=h}
 const dinle=S.durum==='active',n=neOynasin();
 if(T>sonKirp){const f=T-sonKirp;kirpS=f<.16?Math.sin(f/.16*Math.PI):0;if(f>=.16)sonKirp=T+1.8+Math.random()*3}
 if(T>sonBak){hedefBak=Math.random()<.5?[0,0]:[Math.random()-.5,(Math.random()-.5)*.6];sonBak=T+1.2+Math.random()*2.4}
 bakX=lerp(bakX,hedefBak[0],.2);bakY=lerp(bakY,hedefBak[1],.2);
 if(T-surukleAn>.18)surukle*=Math.exp(-dt*6);
 let hedef=S.yon*Math.PI/180;if(S.donus==='oto')hedef+=Math.sin(T*.9)*1.05;
 /* dinlerken, yazı gösterirken ve tepki verirken yüz öne döner */
 if(dinle||yazi||tepki)hedef=0;
 hedef+=surukle*.8;
 if(S.donus==='tur'&&!dinle&&!yazi&&!tepki){simdi.yaw+=dt*1.5}else{let f=hedef-simdi.yaw;f=Math.atan2(Math.sin(f),Math.cos(f));simdi.yaw+=f*(1-Math.exp(-dt*6))}
 let fark=Math.atan2(Math.sin(hedef-simdi.yaw),Math.cos(hedef-simdi.yaw));if(S.donus==='tur'&&!dinle)fark=0;
 simdi.basYaw=lerp(simdi.basYaw,Math.max(-.55,Math.min(.55,fark*.7)),1-Math.exp(-dt*10));
 /* yazı okunurken gövde sade süzülür */
 const ht=tepki?T-tepkiBas:T*S.hiz/100;
 const o=durus(R,ht,n.poz,yazi?'suzul':n.hareket,simdi.yaw,dt);R.bas.r[1]+=simdi.basYaw*.4;
 if(S.eller)for(const kl of R.kollar){const ust=ustMatris(R.kok,kl.el,BIRIM());if(ust&&kl.el.m)sigdir(kl.el,ust,UZAKLIK)}
 const d=R.d,I=halkaBul(T,dinle),gr=I.goz||(n.goz==='normal'&&!dinle?d.idle:d.goz);
 yuzCiz(R.ek.c,{t:T,goz:n.goz,kirp:kirpS,bakX:o.bakX+bakX+simdi.basYaw*.8,bakY:o.bakY+bakY,renk:gr,zemin:d.zemin,kose:d.kose,pay:d.pay+.01,halka:I.halka,agiz:S.agiz,konusuyor:S.konusuyor&&!yazi,yazi:yazi,yaziSure:T-yaziBas,yaziBitti:()=>{yazi=''}});
 motor.yukle(R.ek.tex,R.ek.cv);
 const l=I.halka.renkler;motor.ciz(R.kok,renk(l[Math.floor(T*.7)%l.length]).map(v=>v*I.halka.guc*I.guc),UZAKLIK)}

function kare(z){requestAnimationFrame(kare);
 /* pil için saniyede en çok 30 kare */
 if(z-sonCizim<30)return;sonCizim=z;
 const dt=Math.min(.1,(z-once)/1000||0);once=z;T+=dt;ciz(dt)}

function renkUygula(){const d=MODELLER[0],h=S.renk==='beyaz'||!GOVDE_RENKLERI[S.renk]?d.renk:GOVDE_RENKLERI[S.renk];R.govdeMat.c=renk(h)}
window.robot=function(durum,renkAdi,kip){if(durum==='active')yazi='';S.durum=durum;S.renk=renkAdi;if(kip&&kip!==S.kip){S.kip=kip;ifade=null}if(R)renkUygula()};
window.robotIsik=function(a){isik=a};
window.robotKonus=function(v){S.konusuyor=!!v};
window.robotAyar=function(a){if(!a)return;
 if(a.poz==='oto'||bul(POZLAR,a.poz))S.poz=a.poz;if(bul(HAREKETLER,a.hareket))S.hareket=a.hareket;
 S.yon=+a.yon||0;S.donus=a.donus;if(bul(AGIZLAR,a.agiz))S.agiz=a.agiz;S.eller=a.eller!==false;S.hiz=Math.max(40,Math.min(180,+a.hiz||100))};
window.robotYazi=function(m){if(S.durum!=='idle'||tepki)return;yazi=String(m);yaziBas=T};
window.robotTepki=function(ad){const x=TEPKILER[ad];if(!x)return;
 /* süren baş dönmesini küçük tepkiler kesmez */
 if(tepki&&T<tepki.bit&&tepki.ad==='don'&&ad!=='don')return;
 yazi='';tepki={ad,bit:T+x[0]};tepkiBas=T};
window.robotSurukle=function(v){surukle=Math.max(-1,Math.min(1,+v||0));surukleAn=T};

window.robotHazir=false;
try{motor=new Motor(tuval);const d=MODELLER[0];R=d.kur(motor,d.renk);R.d=d;R.govdeMat=R.kollar[0].parcalar[0].mat;window.robotHazir=true;requestAnimationFrame(kare)}catch(e){console.error(e)}

</script></body></html>
