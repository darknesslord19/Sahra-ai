name: Model denetimi
on:
  push:
    branches: [model-denetimi]
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - name: Model özeti ve Sahra sözcüğü denemesi
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          pip install -q vosk piper-tts
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main/tr/tr_TR/dfki/medium/tr_TR-dfki-medium.onnx
          curl -sSL --fail --max-time 300 -o ses.onnx "$B"; curl -sSL --fail --max-time 60 -o ses.onnx.json "$B.json"
          curl -sS --fail --max-time 300 -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-tr-0.3.zip
          echo "SONUC boyut $(stat -c %s m.zip)"
          echo "SONUC ozet $(sha256sum m.zip | cut -d' ' -f1)"
          unzip -q m.zip
          ls -d vosk-model*/ | sed 's/^/SONUC klasor /'
          ls vosk-model-small-tr-0.3 | sed 's/^/SONUC icerik /'
          cat > dene.py <<'PY'
          import json, wave, subprocess
          from vosk import Model, KaldiRecognizer, SetLogLevel
          SetLogLevel(0)
          m = Model('vosk-model-small-tr-0.3')
          cumleler = ['sahra', 'hey sahra', 'merhaba nasılsın', 'bugün hava çok güzel', 'sofra hazır', 'sıra sende', 'zehra geldi', 'saat kaç']
          for hiz in (120, 160):
              for c in cumleler:
                  subprocess.run(['piper', '-m', 'ses.onnx', '--length-scale', str(120 / hiz), '-f', 'ham.wav'], input=(c + '\n').encode(), check=True, capture_output=True)
                  subprocess.run(['ffmpeg', '-loglevel', 'error', '-y', '-i', 'ham.wav', '-af', 'adelay=500,apad=pad_dur=1', '-ar', '16000', '-ac', '1', 's.wav'], check=True)
                  w = wave.open('s.wav')
                  s2 = KaldiRecognizer(m, 16000)
                  s2.AcceptWaveform(wave.open('s.wav').readframes(10 ** 7))
                  print('SONUC serbest', hiz, c, '->', json.loads(s2.FinalResult()).get('text'))
                  r = KaldiRecognizer(m, 16000, json.dumps(['sahra', '[unk]'], ensure_ascii=False))
                  r.SetWords(True)
                  bulunan = []
                  while True:
                      d = w.readframes(2000)
                      if not d:
                          break
                      if r.AcceptWaveform(d):
                          bulunan += json.loads(r.Result()).get('result', [])
                  bulunan += json.loads(r.FinalResult()).get('result', [])
                  print('SONUC deneme', hiz, c, '->', [(x['word'], round(x['conf'], 2)) for x in bulunan])
          PY
          python3 dene.py > cikti.txt 2>&1
          grep -E 'SONUC' cikti.txt
          grep -iE 'ignoring|missing|grammar' cikti.txt | head -10 | sed 's/^/SONUC uyari /'
