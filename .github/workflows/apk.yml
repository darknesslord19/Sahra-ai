name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Komut testleri
        run: sh tests/calistir.sh
      - name: APK derle
        run: gradle --no-daemon :app:assembleRelease
      - name: testkey ile imzala
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --key imza/testkey.pk8 --cert imza/testkey.x509.pem --out Sahra.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/apksigner" verify --print-certs Sahra.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sahra-APK
          path: Sahra.apk
      - name: Sürüm olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v0.1.${{ github.run_number }}" Sahra.apk --title "Sahra 0.1.${{ github.run_number }}" --notes "testkey ile imzalı deneme APK" --target "${{ github.sha }}"
