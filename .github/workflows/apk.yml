name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Komut testleri
        run: sh tests/calistir.sh
      - name: Bilgi kaynağı denetimi
        continue-on-error: true
        run: |
          curl -sS --fail --max-time 20 -A "Sahra/0.1 (https://github.com/darknesslord19/Sahra-ai)" "https://tr.wikipedia.org/w/api.php?action=query&format=json&generator=search&gsrlimit=1&prop=extracts%7Cpageimages&exintro=1&explaintext=1&pithumbsize=500&gsrsearch=Atat%C3%BCrk" | python3 -c "import json,sys; s=next(iter(json.load(sys.stdin)['query']['pages'].values())); print('SONUC baslik:', s['title'], '| resim:', 'thumbnail' in s, '|', s['extract'][:150])"
      - name: Hava ve piyasa kaynakları denetimi
        continue-on-error: true
        run: |
          UA="Sahra/0.1 (https://github.com/darknesslord19/Sahra-ai)"
          for U in "https://geocoding-api.open-meteo.com/v1/search?count=1&language=tr&name=Ankara" "https://api.open-meteo.com/v1/forecast?latitude=39.9&longitude=32.85&current=temperature_2m,weather_code,is_day,wind_speed_10m" "https://api.gold-api.com/price/XAU"; do
            echo "KAYNAK $(curl -sS --max-time 20 -A "$UA" -w ' HTTP=%{http_code}' "$U" | head -c 600)"
          done
          curl -sS --max-time 20 -A "$UA" -w '\nHTTP=%{http_code}\n' https://www.tcmb.gov.tr/kurlar/today.xml -o /tmp/today.xml | sed 's/^/KAYNAK TCMB /'
          echo "KAYNAK TCMB $(grep -A12 'CurrencyCode="USD"' /tmp/today.xml | grep -E 'ForexSelling' | head -1)"
      - name: APK derle
        run: gradle --no-daemon :app:assembleRelease
      - name: testkey ile imzala
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --key imza/testkey.pk8 --cert imza/testkey.x509.pem --out Sahra.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/apksigner" verify --print-certs Sahra.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sahra-APK
          path: Sahra.apk
      - name: Sürüm olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v0.2.${{ github.run_number }}" Sahra.apk --title "Sahra 0.2.${{ github.run_number }}" --notes "testkey ile imzalı deneme APK" --target "${{ github.sha }}"
