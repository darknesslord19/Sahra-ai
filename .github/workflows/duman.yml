name: Duman testi
on:
  push:
    branches: [model-denetimi]
jobs:
  duman:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - name: Emülatör için derle (x86_64)
        run: |
          sed -i "s/abiFilters 'arm64-v8a', 'armeabi-v7a'/abiFilters 'x86_64'/" app/build.gradle
          gradle --no-daemon -q :app:assembleDebug
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          script: python3 duman/test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ekranlar, path: ekranlar}
